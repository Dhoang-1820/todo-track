name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Validate question bank
        run: python3 tools/build_bank.py
      - name: Collect site files
        run: |
          mkdir -p _site/data
          cp index.html styles.css app.js config.js sw.js _site/
          cp data/questions.json _site/data/
          sed -i "s/?v=dev/?v=${GITHUB_SHA::8}/g" _site/index.html
          sed -i "s/__SHA__/${GITHUB_SHA::7}/g; s/__BUILT__/$(TZ=Asia/Ho_Chi_Minh date '+%d %b %Y, %H:%M')/g" _site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
